# Package metadata and dependencies for MolCurator.
# Full setup (Python deps + LLM): scripts/setup.sh
# Python deps only, with uv:  uv sync
#                  with pip:  pip install -e .
# xTB runs in-process through tblite (a pip package; not installed on Windows, where xTB
# runs through ORCA's built-in xTB instead). ORCA is not on PyPI: install it
# yourself (free academic licence) and set ORCA_BIN or put `orca` on PATH (see README).

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molcurator"
version = "0.1.0"
description = "Agent that creates and curates a molecular benchmark set from a seed molecule"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    # Agent
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=3.1",  # SQLite checkpoints for resume (R7)
    "langchain-core>=0.3",
    "anthropic>=1.17",         # Claude Haiku 4.5 decisions with structured output (default)
    "langchain-openai>=1.0",   # optional OpenAI-compatible backend, e.g. local Ollama
    "rich>=13",                # live terminal progress (R8.3)
    # Chemistry
    "rdkit>=2024.3",           # SMILES handling, sanitisation, 3D embedding
    "selfies>=2.1",            # STONED SELFIES generation
    "pyscf>=2.6",              # DFT / TD-DFT for VALIDATE
    # RDKit 2026.x ships no Intel-Mac wheels (orca-pi pins rdkit<2026 everywhere anyway)
    "rdkit<2026; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Data, config, CLI
    "pandas>=2.0",
    "scikit-learn>=1.3",  # TRAIN: random forest (tools/train.py)
    "joblib>=1.3",        # TRAIN: saves and loads the model bundle
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",      # loads settings (ORCA_BIN, LLM_*) from .env
    "orca-pi>=2.0",           # ORCA through its Python interface OPI (needs NumPy 2)
    "tblite>=0.7 ; sys_platform != 'win32'",  # no Windows wheels: xTB falls back to ORCA there
]

[project.optional-dependencies]
reports = ["matplotlib>=3.8"]
# Mol2Mol (REINVENT4) backend for GENERATE; REINVENT4 is installed from its git repo,
# so it is kept optional while STONED SELFIES is the default generator.
# reinvent = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "jupyter",
    "matplotlib>=3.11.2",
]

[project.scripts]
molcurator = "molcurator.cli:app"
molcurator-properties = "molcurator.batch.cli:main"  # batch xTB/ORCA runs, reports and SLURM jobs

[tool.setuptools.packages.find]
where = ["src"]
include = ["molcurator", "molcurator.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
