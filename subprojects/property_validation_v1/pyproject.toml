[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molcurator-property-validation"
version = "0.1.0"
description = "Isolated property prediction components using shared MolCurator contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rdkit>=2024.3", "pydantic>=2", "pyyaml>=6", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
