# Use case 1: molecules with a HOMO-LUMO gap in a target window (eV), judged at the QM level.
# Read by molcurator.config.load_config; anything omitted uses the defaults in config.py.
target:
  name: homo_lumo_gap
  min: 3.0
  max: 3.5
seeds:
  - "c1ccc(-c2cccs2)s1"  # PLACEHOLDER: 2,2'-bithiophene; replace with the real seed molecule
screening:
  margin: 0.2  # xTB screen accepts 2.8-3.7 eV (xTB is systematically offset from QM)
qm:
  backend: orca
  functional: B3LYP
  basis: def2-SVP
budget:
  max_rounds: 5
  max_qm_calls: 20
  target_dataset_size: 10
decisions: rules  # "llm": Claude Haiku 4.5 decides (needs ANTHROPIC_API_KEY), with these rules as fallback
